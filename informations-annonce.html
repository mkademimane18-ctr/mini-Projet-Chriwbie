<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Informations de l’annonce · Chriwbie</title><link rel="stylesheet" href="assets/css/annonce.css"></head><body data-screen="info"><main class="phone"><header class="topbar"><button class="icon-btn" data-back aria-label="Retour">‹</button><h1>Publier une annonce</h1><a class="icon-btn" href="index.html" aria-label="Fermer">×</a></header><div class="steps" aria-label="Étape 3 sur 5"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div><section class="intro"><div class="eyebrow">Étape 3 sur 5</div><h2>Racontez votre trouvaille.</h2><p>Un titre clair et une description complète attirent plus d’acheteurs.</p></section><form id="listing-form" class="form"><div class="field"><label for="title">Titre de l’annonce</label><input id="title" name="title" required maxlength="80" placeholder="Ex. Fauteuil en rotin naturel"></div><div class="row"><div class="field"><label for="price">Prix (DH)</label><input id="price" name="price" type="number" min="0" required placeholder="950"></div><div class="field"><label>État</label><div class="chips"><button type="button" class="chip" data-value="Neuf">Neuf</button><button type="button" class="chip" data-value="Très bon état">Très bon état</button><button type="button" class="chip" data-value="Bon état">Bon état</button></div></div></div><div class="field"><label for="city">Ville et quartier</label><input id="city" name="city" required placeholder="Ex. Tanger · Malabata"></div><div class="field"><label for="description">Description</label><textarea id="description" name="description" required maxlength="700" placeholder="Décrivez votre article, son état et ses particularités…"></textarea></div><div class="actions"><button type="button" class="btn" id="next">Prévisualiser mon annonce</button></div></form><p class="footnote">Vos informations pourront être modifiées avant publication</p></main><script src="assets/js/annonce.js"></script></body></html>
